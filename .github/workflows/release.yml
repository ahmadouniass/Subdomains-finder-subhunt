name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    name: "Build & publish GitHub Release"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for changelog generation

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov build

      - name: Run full test suite
        run: |
          pytest tests/ -v \
            --tb=short \
            --cov=crtsh_recon \
            --cov-fail-under=80

      - name: Build source distribution & wheel
        run: python -m build

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Extract release notes from CHANGELOG
        id: changelog
        run: |
          python - <<'EOF'
          import re, os

          tag = os.environ["GITHUB_REF_NAME"]          # e.g. v1.0.0
          version = tag.lstrip("v")                    # e.g. 1.0.0

          try:
              content = open("CHANGELOG.md").read()
              # Match the section for this version
              pattern = rf"## \[{re.escape(version)}\].*?(?=\n## |\Z)"
              match = re.search(pattern, content, re.DOTALL)
              notes = match.group(0).strip() if match else f"Release {tag}"
          except FileNotFoundError:
              notes = f"Release {tag}"

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              # GitHub output multiline syntax
              fh.write("NOTES<<EOF_NOTES\n")
              fh.write(notes + "\n")
              fh.write("EOF_NOTES\n")
          EOF
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: "crtsh-recon ${{ steps.version.outputs.VERSION }}"
          body: ${{ steps.changelog.outputs.NOTES }}
          draft: false
          prerelease: false
          files: |
            dist/*.tar.gz
            dist/*.whl
